server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: chalochalein
  datasource:                       # least-privilege app role
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chalochalein}
    username: ${DB_APP_USER:chalo_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:                           # migrations run as a separate owner role
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chalochalein}
    user: ${DB_MIGRATOR_USER:chalo_migrator}
    password: ${DB_MIGRATOR_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; set to "none" if validate complains
  session:
    jdbc:
      initialize-schema: never      # table comes from V2 migration
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
          temperature: 0.2
          max-output-tokens: 700
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

chalo:
  agent-db:                         # read-only role, views only
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chalochalein}
    username: ${AGENT_DB_USER:chalo_agent_ro}
    password: ${AGENT_DB_PASSWORD}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  dev:
    seed-password: ${DEV_SEED_PASSWORD:}