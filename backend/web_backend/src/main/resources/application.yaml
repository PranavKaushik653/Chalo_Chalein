server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}   # true in production
        same-site: lax

spring:
  application:
    name: chalochalein
  datasource:
    url: jdbc:postgresql://localhost:5433/chalochalein
    username: chalo
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # set to "none" if it complains before the entities exist
  session:
    jdbc:
      initialize-schema: never    # the table comes from V2 later

chalo:
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}