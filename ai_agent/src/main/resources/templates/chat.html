<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chalo Chalein</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
          font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
          background: #f4f5f7;
          display: flex;
          justify-content: center;
        }
        .chat {
          width: 100%;
          max-width: 720px;
          height: 100%;
          display: flex;
          flex-direction: column;
          background: #fff;
          border-left: 1px solid #e3e5e8;
          border-right: 1px solid #e3e5e8;
        }
        .header {
          padding: 16px 20px;
          font-size: 17px;
          font-weight: 600;
          border-bottom: 1px solid #e3e5e8;
        }
        .messages {
          flex: 1;
          overflow-y: auto;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .msg {
          max-width: 80%;
          padding: 10px 14px;
          border-radius: 14px;
          font-size: 15px;
          line-height: 1.5;
          white-space: pre-wrap;
          word-wrap: break-word;
        }
        .bot  { background: #eef0f3; color: #1c1e21; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: #2563eb; color: #fff;    align-self: flex-end;   border-bottom-right-radius: 4px; }
        .typing { color: #777; font-style: italic; }
        .input-row {
          display: flex;
          gap: 8px;
          padding: 14px 16px;
          border-top: 1px solid #e3e5e8;
        }
        .input-row input {
          flex: 1;
          padding: 12px 14px;
          font-size: 15px;
          border: 1px solid #cfd3d8;
          border-radius: 22px;
          outline: none;
        }
        .input-row input:focus { border-color: #2563eb; }
        .input-row button {
          padding: 0 20px;
          font-size: 15px;
          color: #fff;
          background: #2563eb;
          border: none;
          border-radius: 22px;
          cursor: pointer;
        }
        .input-row button:disabled { background: #9db7ef; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="chat">
    <div class="header">Chalo Chalein</div>
    <div class="messages" id="messages">
        <div class="msg bot">How can I help you?</div>
    </div>
    <div class="input-row">
        <input id="input" type="text" placeholder="Type your message..." autocomplete="off" autofocus>
        <button id="send">Send</button>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // One id per page load so the agent remembers the conversation
    const conversationId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : String(Date.now());

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Minimal formatting: **bold** and "- " bullets
    function format(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^\s*[-*] /gm, '• ');
    }

    function addMessage(text, who, asHtml) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      if (asHtml) div.innerHTML = text; else div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;

      addMessage(text, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;
      const typing = addMessage('Typing...', 'bot typing');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, conversationId })
        });
        const reply = await res.text();
        typing.remove();
        addMessage(res.ok ? format(reply) : 'Something went wrong. Please try again.', 'bot', res.ok);
      } catch (e) {
        typing.remove();
        addMessage('Could not reach the server. Please try again.', 'bot');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
